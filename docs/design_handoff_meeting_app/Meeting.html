<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Meeting — macOS app design</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-1:#0a0d12;
    --bg-2:#161a22;
    --ink:#e8eaef;
    --ink-dim:#9aa0ac;
    --ink-faint:#5b6370;
    --accent:oklch(0.72 0.15 250);
    --accent-2:oklch(0.78 0.16 25);
    --record:#ff5d57;
    --ok:#30d158;
  }
  html,body{margin:0;padding:0;background:var(--bg-1);color:var(--ink);font-family:Inter,-apple-system,sans-serif;}
  body{
    /* decorative wallpaper that the liquid glass surfaces blur over */
    background:
      radial-gradient(1200px 700px at 12% 8%, oklch(0.55 0.18 260 / .55), transparent 60%),
      radial-gradient(900px 600px at 92% 18%, oklch(0.65 0.18 18 / .35), transparent 55%),
      radial-gradient(800px 500px at 70% 95%, oklch(0.6 0.18 200 / .4), transparent 60%),
      radial-gradient(1000px 600px at 18% 92%, oklch(0.55 0.18 320 / .35), transparent 55%),
      linear-gradient(180deg, #0a0d12 0%, #1a1f2b 100%);
    background-attachment: fixed;
    min-height:100vh;
  }
  *{box-sizing:border-box;}
  /* canvas chrome */
  .stage{
    max-width:1320px;
    margin:0 auto;
    padding:48px 32px 96px;
  }
  .crumb{
    display:flex;align-items:center;gap:14px;
    color:var(--ink-dim);
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    margin-bottom:8px;
  }
  .crumb .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);}
  h1.title{
    font-family:'Instrument Serif',serif;
    font-weight:400;font-size:64px;letter-spacing:-.02em;line-height:1;
    margin:0 0 12px;
    color:#fff;
  }
  .lede{
    color:var(--ink-dim);
    max-width:720px;font-size:16px;line-height:1.55;
  }
  .section-label{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;
    display:flex;align-items:center;gap:10px;margin-bottom:24px;
  }
  .section-label::before{content:"";width:24px;height:1px;background:var(--ink-faint);}

  .row{display:flex;gap:48px;align-items:flex-start;flex-wrap:wrap;}
  .col-stack{display:flex;flex-direction:column;gap:24px;}

  /* small caption under each frame */
  .caption{
    margin-top:14px;
    font-size:13px;color:var(--ink-dim);max-width:540px;line-height:1.5;
  }
  .caption b{color:var(--ink);font-weight:600;}

  /* desktop wallpaper context for frames */
  .desktop{
    position:relative;border-radius:18px;overflow:hidden;
    background:
      radial-gradient(700px 400px at 20% 10%, oklch(0.55 0.18 260 / .8), transparent 60%),
      radial-gradient(500px 300px at 90% 90%, oklch(0.6 0.2 22 / .7), transparent 55%),
      linear-gradient(135deg, #1a2238 0%, #2b1430 100%);
    box-shadow:0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.04);
    padding:24px;
  }

  /* menu bar bezel */
  .menubar{
    height:28px;
    background:rgba(20,22,30,.55);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border-radius:12px 12px 0 0;
    display:flex;align-items:center;
    padding:0 14px;
    gap:18px;
    color:rgba(255,255,255,.92);
    font-size:13px;font-weight:500;
    letter-spacing:-.005em;
    border-bottom:.5px solid rgba(255,255,255,.06);
  }
  .menubar .apple{font-size:14px;}
  .menubar .app-name{font-weight:700;}
  .menubar .menus{display:flex;gap:14px;color:rgba(255,255,255,.85);}
  .menubar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:rgba(255,255,255,.85);}
  .menubar .icon{display:inline-flex;align-items:center;justify-content:center;}
  .menubar .recording-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--record);
    box-shadow:0 0 10px var(--record);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

  .text-link{color:var(--accent);text-decoration:none;}
  .text-link:hover{text-decoration:underline;}

  /* utility */
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .serif{font-family:'Instrument Serif',serif;}

  /* fade-in on load */
  .fade{opacity:0;transform:translateY(12px);animation:fadein .9s cubic-bezier(.2,.8,.2,1) forwards;}
  @keyframes fadein{to{opacity:1;transform:none;}}
  .fade.d1{animation-delay:.05s}
  .fade.d2{animation-delay:.15s}
  .fade.d3{animation-delay:.25s}
  .fade.d4{animation-delay:.35s}
  .fade.d5{animation-delay:.45s}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/glass.jsx"></script>
<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/menubar-popover.jsx"></script>
<script type="text/babel" src="src/library.jsx"></script>
<script type="text/babel" src="src/recording.jsx"></script>
<script type="text/babel" src="src/transcript.jsx"></script>
<script type="text/babel" src="src/permissions.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>

</body>
</html>
